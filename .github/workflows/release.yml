name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Require master
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "${RELEASE_REF}" != "refs/heads/master" ]]; then
            echo "Run this workflow from the master branch." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail

          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          latest_tag=""
          major=0
          minor=0
          patch=0

          while IFS= read -r candidate; do
            if [[ "${candidate}" =~ ${semver_pattern} ]]; then
              latest_tag="${candidate}"
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)

          case "${VERSION_BUMP}" in
            patch)
              patch=$((patch + 1))
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            *)
              echo "Unsupported version increment: ${VERSION_BUMP}" >&2
              exit 1
              ;;
          esac

          next_tag="v${major}.${minor}.${patch}"
          if git rev-parse --quiet --verify "refs/tags/${next_tag}" >/dev/null; then
            echo "Tag already exists: ${next_tag}" >&2
            exit 1
          fi

          echo "tag=${next_tag}" >> "${GITHUB_OUTPUT}"
          printf 'Previous version: %s\nNext version: %s\n' \
            "${latest_tag:-none}" "${next_tag}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --generate-notes
